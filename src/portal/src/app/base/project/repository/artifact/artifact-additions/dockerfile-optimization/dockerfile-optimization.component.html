<div class="dockerfile-optimization-container">
    <div class="action-row">
        <button
            class="btn btn-primary"
            [disabled]="loading"
            (click)="optimize()">
            <clr-spinner *ngIf="loading" [clrSmall]="true"></clr-spinner>
            <span>{{ 'REPOSITORY.OPTIMIZE_DOCKERFILE' | translate }}</span>
        </button>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        <div class="alert-items">
            <div class="alert-item static">
                <div class="alert-icon-wrapper">
                    <cds-icon class="alert-icon" shape="exclamation-circle"></cds-icon>
                </div>
                <span class="alert-text">{{ errorMessage }}</span>
            </div>
        </div>
    </div>

    <div *ngIf="result" class="clr-row comparison-panels">
        <div class="clr-col-6">
            <h5>{{ 'REPOSITORY.DOCKERFILE_ORIGINAL' | translate }}</h5>
            <pre class="dockerfile-pre">{{ result.dockerfile }}</pre>
        </div>
        <div class="clr-col-6">
            <h5>{{ 'REPOSITORY.DOCKERFILE_OPTIMIZED' | translate }}</h5>
            <pre class="dockerfile-pre">{{ result.optimized_dockerfile }}</pre>
        </div>
    </div>

    <p *ngIf="!loading && !result && !errorMessage" class="hint-text">
        {{ 'REPOSITORY.DOCKERFILE_HINT' | translate }}
    </p>
</div>
